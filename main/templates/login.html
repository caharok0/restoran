{% extends 'base.html' %}

{% block title %}Вхід | Наш ресторан{% endblock %}

{% block content %}
<section class="auth-card">
    <p class="eyebrow">Раді бачити вас знову</p>
    <h1>Увійти</h1>
    <form method="post">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}">
        {{ form.as_p }}
        <button type="submit">Увійти</button>
    </form>
    <p class="auth-switch">Ще не маєте облікового запису? <a class="text-link" href="{% url 'register' %}">Приєднуйтеся</a>.</p>
</section>
<div class="demo-logins">
    <p>Швидкий вхід для демонстрації</p>
    <form method="post">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}">
        <input type="hidden" name="demo_role" value="admin">
        <button type="submit" class="demo-button demo-admin">Увійти як адміністратор</button>
    </form>
    <form method="post">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}">
        <input type="hidden" name="demo_role" value="user">
        <button type="submit" class="demo-button demo-user">Увійти як користувач</button>
    </form>
</div>
{% endblock %}
