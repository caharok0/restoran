{% extends 'base.html' %}

{% block title %}Вхід | Наш ресторан{% endblock %}

{% block content %}
<section class="auth-card">
    <p class="eyebrow">Раді бачити вас знову</p>
    <h1>Увійти</h1>
    <form method="post">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}">
        {{ form.as_p }}
        <button type="submit">Увійти</button>
    </form>
    <p class="auth-switch">Ще не маєте облікового запису? <a class="text-link" href="{% url 'register' %}">Приєднуйтеся</a>.</p>
</section>
{% endblock %}
